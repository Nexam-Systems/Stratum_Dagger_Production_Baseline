name: Build on tag (Windows / MSVC / Qt)

# Fires when finish-feature.sh pushes a vX.Y.Z tag. A green run proves the tagged
# version compiles on the SAME toolchain as BUILD-Windows.md: MSVC 2022 + Qt + Ninja.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # allow manual runs for debugging

# gh release upload (Attach MSI to Release) needs write access to release assets.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these aligned with qgroundcontrol/build-config.json and BUILD-Windows.md.
  QT_VERSION: '6.10.3'
  QT_ARCH: 'win64_msvc2022_64'
  BUILD_TYPE: 'Release'

jobs:
  build-windows:
    runs-on: windows-2022          # ships Visual Studio 2022 (v143)
    timeout-minutes: 120           # QGC is a large tree; first configure is slow
    strategy:
      fail-fast: false             # a dev failure must not cancel the client build
      matrix:
        variant: [client, dev]     # client = shipping UI; dev = operator-hidden UI re-enabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Hard fork: QGC source is vendored as ordinary files in this repo.
          # There is NO submodule. Pulling one here would have fetched pristine
          # upstream QGC and dropped all STRATUM branding/AOP work ("no branding").
          submodules: false
          fetch-depth: 0           # full history so the tag/describe works

      - name: Set up MSVC (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          # Authoritative list copied verbatim from qgroundcontrol/.github/build-config.json
          # ("qt_modules"). This is exactly what QGC's own CI installs — keep it in sync
          # if you ever update the vendored QGC tree.
          modules: >-
            qtgraphs
            qtlocation
            qtpositioning
            qtspeech
            qtmultimedia
            qtserialport
            qtimageformats
            qtshadertools
            qtconnectivity
            qtquick3d
            qtsensors
            qtscxml
            qtwebsockets
            qthttpserver
          cache: true              # cache the Qt install between runs

      - name: Configure (qt-cmake + Ninja)
        working-directory: qgroundcontrol
        shell: cmd
        run: >-
          "%QT_ROOT_DIR%\bin\qt-cmake.bat" -B build -G Ninja
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE%
          -DQGC_BUILD_TESTING=OFF
          -DSTRATUM_DEV_BUILD=${{ matrix.variant == 'dev' && 'ON' || 'OFF' }}

      - name: Build
        working-directory: qgroundcontrol
        shell: cmd
        run: cmake --build build --parallel

      # The build succeeding IS the verification. The steps below deploy all Qt
      # dependencies and package the variant MSI, then publish it.
      - name: Package (deploy + MSI)
        id: package
        uses: ./.github/actions/package-windows
        with:
          source-dir: qgroundcontrol
          build-dir: build
          variant: ${{ matrix.variant }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: STRATUM-${{ matrix.variant }}-msi-${{ github.ref_name }}
          path: ${{ steps.package.outputs.msi-path }}
          if-no-files-found: error
          retention-days: 14

      # Attach the variant MSI to the GitHub Release, if one exists.
      - name: Attach MSI to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.package.outputs.msi-path }}" --clobber
          } else {
            Write-Host "No Release for $tag (tag pushed without --release). MSI still available under Actions."
          }
